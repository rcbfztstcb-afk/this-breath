  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Karla:wght@400;500&display=swap');

    :root{
        --fog:#F2F4F3;
        --fog-deep:#E3EAE7;
        --ink:#2E3532;
        --ink-faded:#75817C;
        --breath:#A9C4BC;
        --breath-soft:#C6D8D2;
        --water:#567B71;
        --line:#CBD6D2;
    }

    *{ box-sizing:border-box; }

    html,body{ margin:0; padding:0; }

    body{
        min-height:100dvh;
        display:flex;
        flex-direction:column;
        align-items:center;
        background:radial-gradient(120% 60% at 50% 0%, var(--fog-deep) 0%, var(--fog) 55%);
        color:var(--ink);
        font-family:'Karla', -apple-system, 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing:antialiased;
    }

    .col{
        width:100%;
        max-width:34rem;
        display:flex;
        flex-direction:column;
        flex:1;
        padding:0 1.5rem;
    }

    /* ——— header: wordmark + the breathing circle ——— */

    .head{
        position:sticky;
        top:0;
        z-index:2;
        display:flex;
        flex-direction:column;
        align-items:center;
        padding:2.2rem 0 1.1rem;
        background:linear-gradient(var(--fog-deep) 55%, rgba(242,244,243,0));
    }

    .mark{
        font-family:'Lora', Georgia, serif;
        font-style:italic;
        font-size:.85rem;
        letter-spacing:.12em;
        color:var(--ink-faded);
        margin-bottom:1.3rem;
        user-select:none;
    }

    .circle-wrap{
        position:relative;
        width:64px; height:64px;
        display:grid; place-items:center;
    }
    .circle{
        width:34px; height:34px;
        border-radius:50%;
        background:var(--breath);
        animation:breathe 8s ease-in-out infinite;
    }
    .ring{
        position:absolute; inset:0;
        border-radius:50%;
        border:1px solid var(--breath-soft);
        animation:breathe-ring 8s ease-in-out infinite;
    }
    @keyframes breathe{
        0%,100%{ transform:scale(1); }
        50%{ transform:scale(1.55); }
    }
    @keyframes breathe-ring{
        0%,100%{ transform:scale(.72); opacity:.55; }
        50%{ transform:scale(1); opacity:.95; }
    }

    .wait{
        height:1.1rem;
        margin-top:.55rem;
        font-size:.72rem;
        letter-spacing:.06em;
        color:var(--ink-faded);
        opacity:0;
        transition:opacity .9s ease .4s;
        user-select:none;
    }
    .wait.on{ opacity:.85; }

    .again{
        position:fixed;
        top:1.15rem;
        inset-inline-end:1.4rem;
        z-index:3;
        font-size:.7rem;
        letter-spacing:.08em;
        color:var(--ink-faded);
        background:none; border:none;
        cursor:pointer;
        opacity:.55;
        padding:.3rem;
        font-family:inherit;
    }
    .again:hover{ opacity:1; }
    .again:focus-visible{
        outline:1.5px solid var(--water);
        outline-offset:2px;
        border-radius:4px;
        opacity:1;
    }

    /* ——— conversation ——— */

    .chat{
        flex:1;
        display:flex;
        flex-direction:column;
        gap:1.7rem;
        padding:1.2rem 0 1rem;
    }

    .msg{
        white-space:pre-line;
        animation:fade-in .9s ease both;
        overflow-wrap:break-word;
    }
    @keyframes fade-in{
        from{ opacity:0; transform:translateY(6px); }
        to{ opacity:1; transform:translateY(0); }
    }

    .msg.guide{
        font-family:'Lora', Georgia, serif;
        font-size:1.08rem;
        line-height:1.85;
        color:var(--ink);
        max-width:95%;
    }

    .msg.person{
        align-self:flex-end;
        text-align:end;
        font-size:.95rem;
        line-height:1.6;
        color:var(--water);
        max-width:82%;
    }
    [dir="rtl"] .msg.person{ align-self:flex-start; }

    .msg.note{
        align-self:center;
        text-align:center;
        font-family:'Lora', Georgia, serif;
        font-style:italic;
        font-size:.85rem;
        color:var(--ink-faded);
    }

    /* ——— input ——— */

    .foot{
        position:sticky;
        bottom:0;
        padding:1rem 0 calc(1.4rem + env(safe-area-inset-bottom));
        background:linear-gradient(rgba(242,244,243,0), var(--fog) 42%);
    }
    .inputrow{
        display:flex;
        align-items:center;
        gap:.8rem;
    }
    .input{
        flex:1;
        background:transparent;
        border:none;
        border-bottom:1px solid var(--line);
        padding:.55rem .1rem;
        font-family:'Karla', -apple-system, system-ui, sans-serif;
        font-size:1rem; /* 16px — keeps mobile browsers from zooming */
        color:var(--ink);
        transition:border-color .4s ease;
        border-radius:0;
    }
    .input::placeholder{ color:var(--ink-faded); opacity:.7; }
    .input:focus{ outline:none; border-bottom-color:var(--water); }

    .send{
        width:38px; height:38px;
        border-radius:50%;
        border:none;
        background:var(--water);
        color:var(--fog);
        font-size:1rem;
        cursor:pointer;
        display:grid; place-items:center;
        transition:opacity .3s ease, transform .2s ease;
        flex-shrink:0;
    }
    .send:disabled{ opacity:.35; cursor:default; }
    .send:not(:disabled):hover{ transform:translateY(-1px); }
    .send:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

    @media (prefers-reduced-motion: reduce){
        .circle,.ring{ animation:none; }
        .msg{ animation:none; }
    }
    </style>
  </head>

    <button class="again" id="again" type="button"></button>

                      <button class="send" id="send" type="button" disabled>↑</button>
              </div>
        </footer>
    </div>

                slipped: "糸がほどけました——ひと呼吸して、もう一度どうぞ"
          },
          ko: {
                mark: "이 호흡",
                first: "안녕하세요. 와 주셔서 기뻐요.\n\n필요한 모든 것으로 시작해요 — 그리고 그것은 이미 당신에게 있어요.\n\n숨이 한 번 들어올 때… 들어오고 있음을 알아차리세요.\n숨이 한 번 나갈 때… 나가고 있음을 알아차리세요.\n\n그게 전부예요. 그것이 수련의 전부예요.\n\n무엇을 느끼셨나요?",
                placeholder: "무엇을 느끼셨나요?",
                wait: "기다리는 동안, 숨 한 번",
                again: "다시 시작",
                slipped: "실을 놓쳤어요 — 숨 한 번 쉬고, 다시 해 보세요"
          },
          sw: {
                mark: "pumzi hii",
                first: "Habari. Nimefurahi uko hapa.\n\nTunaanza na kila kitu unachohitaji — na tayari unacho.\n\nPumzi moja ndani… jua kwamba inaingia.\nPumzi moja nje… jua kwamba inatoka.\n\nNdivyo hivyo tu. Hiyo ndiyo mazoezi yote.\n\nUliona nini?",
                placeholder: "uliona nini?",
                wait: "pumzi moja, unaposubiri",
                again: "anza upya",
                slipped: "uzi umeteleza — vuta pumzi moja, kisha jaribu tena"
          },
          tl: {
                mark: "ang hiningang ito",
                first: "Kumusta. Masaya ako na nandito ka.\n\nSisimulan natin sa lahat ng kailangan mo — at nasa iyo na ito.\n\nIsang paghinga papasok… alamin na ito ay pumapasok.\nIsang paghinga palabas… alamin na ito ay lumalabas.\n\nIyon lang. Iyon na ang buong pagsasanay.\n\nAno ang napansin mo?",
                placeholder: "ano ang napansin mo?",
                wait: "isang hininga, habang naghihintay",
                again: "magsimulang muli",
                slipped: "nabitawan ang sinulid — isang hininga, saka subukang muli"
          }
      };

      const RTL = new Set(["ar", "fa", "he"]);

      function pickLang() {
          const prefs = navigator.languages || [navigator.language || "en"];
          for (const tag of prefs) {
                const primary = String(tag).toLowerCase().split("-")[0];
                if (STRINGS[primary]) return primary;
          }
          return "en";
      }

      const LANG = pickLang();
      const T = STRINGS[LANG];

      document.documentElement.lang = LANG;
      document.documentElement.dir = RTL.has(LANG) ? "rtl" : "ltr";
      document.title = T.mark;

      // ————————————————————————————————————————————————
      // The meeting. Nothing is stored — not here, not on the server.
      // Close the page, and the meeting returns to air.
      // ————————————————————————————————————————————————

      const chat = document.getElementById("chat");
      const inputEl = document.getElementById("input");
      const sendEl = document.getElementById("send");
      const waitEl = document.getElementById("wait");
      const againEl = document.getElementById("again");
      const markEl = document.getElementById("mark");

      markEl.textContent = T.mark;
      waitEl.textContent = T.wait;
      againEl.textContent = T.again;
      inputEl.placeholder = T.placeholder;

      let messages = [];
      let waiting = false;

      function addMessage(msg) {
          messages.push(msg);
          const div = document.createElement("div");
          div.className =
                "msg " + (msg.note ? "note" : msg.role === "assistant" ? "guide" : "person");
          div.textContent = msg.content;
          chat.appendChild(div);
          div.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      function setWaiting(on) {
          waiting = on;
          waitEl.classList.toggle("on", on);
          sendEl.disabled = on || !inputEl.value.trim();
      }

      function beginAgain() {
          messages = [];
          chat.innerHTML = "";
          setWaiting(false);
          addMessage({ role: "assistant", content: T.first, seed: true });
          inputEl.focus();
      }

      async function send() {
          const text = inputEl.value.trim();
          if (!text || waiting) return;

          addMessage({ role: "user", content: text });
          inputEl.value = "";
          setWaiting(true);

          const payload = messages
            .filter((m) => !m.seed && !m.note)
            .map((m) => ({ role: m.role, content: m.content }));

          try {
                const res = await fetch("/api/breathe", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ messages: payload, lang: LANG })
                });
                const data = await res.json();
                if (!res.ok || !data.reply) throw new Error(data.error || "empty");
                addMessage({ role: "assistant", content: data.reply });
          } catch (err) {
                addMessage({ role: "assistant", content: T.slipped, note: true });
          } finally {
                setWaiting(false);
                inputEl.focus();
          }
      }

      sendEl.addEventListener("click", send);
      inputEl.addEventListener("input", () => {
          sendEl.disabled = waiting || !inputEl.value.trim();
      });
      inputEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.isComposing) send();
      });
      againEl.addEventListener("click", beginAgain);

      beginAgain();

      // The app installs to any home screen, like a real app — because it is one.
      if ("serviceWorker" in navigator) {
          window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js").catch(() => {});
          });
      }
        </script>
  </body>
</html>
